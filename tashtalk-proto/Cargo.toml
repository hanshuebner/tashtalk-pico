[package]
name = "tashtalk-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TashTalk host byte protocol, CRC, bit-stuffing — no_std, host-testable."

[features]
default = []
# `defmt` enables defmt::Format derives on public types so the firmware can
# log them. Off by default so host unit tests don't need defmt in scope.
defmt = ["dep:defmt"]

[dependencies]
defmt = { version = "1.1", optional = true }
heapless = "0.9"
pio = "0.3"

[dev-dependencies]
pio-proc = "0.3"
