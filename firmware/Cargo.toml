[package]
name = "tashtalk-pico-firmware"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TashTalk reimplementation for Raspberry Pi Pico (RP2040) over USB-CDC."

[[bin]]
name = "tashtalk-pico"
path = "src/main.rs"
test = false
bench = false

# Embassy is moving fast and crates.io releases lag the git tip. The versions
# below are what was current on crates.io at the time of writing; if a build
# fails after a `cargo update`, switch to the matching git pin in the embassy
# repository.
[dependencies]
tashtalk-proto = { path = "../tashtalk-proto", features = ["defmt"] }

embassy-executor = { version = "0.6", features = ["arch-cortex-m", "executor-thread", "defmt", "integrated-timers", "task-arena-size-65536"] }
embassy-time = { version = "0.3", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.2", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rt"] }
embassy-usb = { version = "0.3", features = ["defmt"] }
embassy-sync = { version = "0.6", features = ["defmt"] }
embassy-futures = "0.1"

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"

defmt = "0.3"
defmt-rtt = "0.4"
# Custom panic handler in main.rs reboots to BOOTSEL on any panic, so we
# can detect panics without an SWD probe. panic-probe is removed.

static_cell = "2"
heapless = "0.8"
portable-atomic = { version = "1", features = ["critical-section"] }
fixed = "1"
pio = "0.2"
pio-proc = "0.2"
